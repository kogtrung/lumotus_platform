spring:
  application:
    name: lumotus

  # Đọc .env ở thư mục gốc monorepo (khi chạy mvn từ backend/)
  config:
    import: optional:file:../.env[.properties]

  # ── Profiles ─────────────────────────────────────────────
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── Database ─────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lumotus}
    username: ${DB_USER:lumotus_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ── JPA ──────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate           # Flyway quản lý schema — JPA chỉ validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # ── Flyway ───────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ── Redis ────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # ── Async (ThreadPool) ───────────────────────────────────
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
      thread-name-prefix: lumotus-async-

# ── Server ───────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# ── Security / JWT ───────────────────────────────────────────
security:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-at-least-256-bits-long}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}       # 15 phút
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}

# ── App Config ───────────────────────────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # Dev: email user đã đăng ký → tự gán role ADMIN khi startup (để trống trên prod)
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

  # Cloudinary (Media Storage)
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: lumotus
    max-file-size-mb: 5
  ai:
    provider: ${AI_PROVIDER:openai}
    openai-api-key: ${OPENAI_API_KEY:}
    claude-api-key: ${CLAUDE_API_KEY:}
    max-cards-per-request: 50

  # Redis TTL
  redis:
    refresh-token-ttl-days: ${JWT_REFRESH_EXPIRY_DAYS:7}
    leaderboard-cache-ttl-seconds: 60
    job-cache-ttl-minutes: 30
    topics-cache-ttl-minutes: 10

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ── Springdoc / Swagger ──────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ── Logging ──────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.backend.lumotus: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: logs/lumotus.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
